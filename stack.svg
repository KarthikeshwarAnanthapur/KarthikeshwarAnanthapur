<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
  <rect width="900" height="460" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- Header -->
  <rect width="900" height="42" rx="12" fill="#161b22"/>
  <rect y="30" width="900" height="12" fill="#161b22"/>

  <!-- Mac Buttons -->
  <circle cx="24" cy="21" r="7" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="7" fill="#ffbd2e"/>
  <circle cx="72" cy="21" r="7" fill="#27ca40"/>

  <text x="450"
        y="26"
        text-anchor="middle"
        font-family="JetBrains Mono, monospace"
        font-size="12"
        fill="#8b949e">
    dark@github ~ — stack
  </text>

  <g font-family="JetBrains Mono, monospace" font-size="18">

    <!-- Command -->
    <text x="25" y="80" fill="#3fb950">❯</text>
    <text x="55" y="80" fill="#3fb950">npm</text>
    <text x="110" y="80" fill="#ffffff">run tech-stack</text>

    <!-- Output -->
    <text x="25" y="125" fill="#58a6ff">&gt; tech-stack@1.0.0</text>
    <text x="25" y="160" fill="#c9d1d9">&gt; node scripts/stack.js</text>

    <!-- Tree -->
    <text x="25" y="210" fill="#7ee787">📁 stack/</text>

    <text x="50" y="250" fill="#8b949e">├──</text>
    <text x="100" y="250" fill="#79c0ff">frontend/</text>
    <text x="280" y="250" fill="#c9d1d9">React • Tailwind • JavaScript</text>

    <text x="50" y="285" fill="#8b949e">├──</text>
    <text x="100" y="285" fill="#79c0ff">backend/</text>
    <text x="280" y="285" fill="#c9d1d9">Node.js • Express</text>

    <text x="50" y="320" fill="#8b949e">├──</text>
    <text x="100" y="320" fill="#79c0ff">database/</text>
    <text x="280" y="320" fill="#c9d1d9">MongoDB • MySQL</text>

    <text x="50" y="355" fill="#8b949e">├──</text>
    <text x="100" y="355" fill="#79c0ff">cybersecurity/</text>
    <text x="280" y="355" fill="#c9d1d9">SOC • SIEM • Networking</text>

    <text x="50" y="390" fill="#8b949e">├──</text>
    <text x="100" y="390" fill="#79c0ff">cloud/</text>
    <text x="280" y="390" fill="#c9d1d9">Azure • GitHub</text>

    <text x="50" y="425" fill="#8b949e">└──</text>
    <text x="100" y="425" fill="#79c0ff">ai/</text>
    <text x="280" y="425" fill="#c9d1d9">Gemini • OpenAI</text>

  </g>
</svg>
