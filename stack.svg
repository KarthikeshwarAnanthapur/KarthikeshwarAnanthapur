<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">

  <!-- Background -->
  <rect width="900" height="400" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- Header -->
  <rect width="900" height="42" rx="12" fill="#161b22"/>
  <rect y="30" width="900" height="12" fill="#161b22"/>

  <!-- Mac Buttons -->
  <circle cx="24" cy="21" r="7" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="7" fill="#ffbd2e"/>
  <circle cx="72" cy="21" r="7" fill="#27ca40"/>

  <!-- Title -->
  <text
    x="450"
    y="26"
    text-anchor="middle"
    font-family="monospace"
    font-size="12"
    fill="#8b949e">
    karthikeshwar@github ~/stack
  </text>

  <!-- Terminal Content -->
  <g font-family="monospace" font-size="18">

    <!-- Command -->
    <text x="25" y="78" fill="#3fb950">&gt;</text>
    <text x="55" y="78" fill="#3fb950">npm</text>
    <text x="105" y="78" fill="#ffffff">run tech-stack</text>

    <!-- Output -->
    <text x="25" y="118" fill="#58a6ff">&gt; tech-stack@1.0.0</text>
    <text x="25" y="148" fill="#c9d1d9">&gt; node scripts/stack.js</text>

    <!-- Stack -->

    <text x="60" y="205" fill="#79c0ff">frontend</text>
    <text x="180" y="205" fill="#c9d1d9">:</text>
    <text x="210" y="205" fill="#a5d6ff">React • Tailwind • JavaScript</text>

    <text x="60" y="240" fill="#79c0ff">backend</text>
    <text x="180" y="240" fill="#c9d1d9">:</text>
    <text x="210" y="240" fill="#7ee787">Node.js • Express</text>

    <text x="60" y="275" fill="#79c0ff">languages</text>
    <text x="180" y="275" fill="#c9d1d9">:</text>
    <text x="210" y="275" fill="#e3b341">Java • Python • JavaScript</text>

    <text x="60" y="310" fill="#79c0ff">database</text>
    <text x="180" y="310" fill="#c9d1d9">:</text>
    <text x="210" y="310" fill="#58a6ff">MongoDB • MySQL</text>

    <text x="60" y="345" fill="#79c0ff">security</text>
    <text x="180" y="345" fill="#c9d1d9">:</text>
    <text x="210" y="345" fill="#ffa657">SOC • SIEM • Networking</text>

    <text x="60" y="380" fill="#79c0ff">ai</text>
    <text x="180" y="380" fill="#c9d1d9">:</text>
    <text x="210" y="380" fill="#ff7b72">Gemini • OpenAI</text>

  </g>

</svg>
