<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <rect width="900" height="540" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- Header -->
  <rect width="900" height="42" rx="12" fill="#161b22"/>
  <rect y="30" width="900" height="12" fill="#161b22"/>

  <!-- Mac Buttons -->
  <circle cx="24" cy="21" r="7" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="7" fill="#ffbd2e"/>
  <circle cx="72" cy="21" r="7" fill="#27ca40"/>

  <!-- Title -->
  <text x="450"
        y="26"
        text-anchor="middle"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="12"
        fill="#8b949e">
    karthikeshwar@github ~/portfolio
  </text>

  <g font-family="JetBrains Mono, Consolas, monospace" font-size="18">

    <!-- Command -->
    <text x="25" y="80" fill="#3fb950">❯</text>
    <text x="55" y="80" fill="#3fb950">npm</text>
    <text x="110" y="80" fill="#ffffff">run about-me</text>

    <!-- Output -->
    <text x="25" y="125" fill="#58a6ff">&gt; about-me@1.0.0</text>
    <text x="25" y="160" fill="#c9d1d9">&gt; node scripts/about-me.js</text>

    <!-- JSON -->
    <text x="25" y="210" fill="#f2cc60">{</text>

    <text x="60" y="245" fill="#79c0ff">"name"</text>
    <text x="260" y="245" fill="#c9d1d9">:</text>
    <text x="290" y="245" fill="#a5d6ff">"Karthikeshwar Ananthapur"</text>

    <text x="60" y="280" fill="#79c0ff">"role"</text>
    <text x="260" y="280" fill="#c9d1d9">:</text>
    <text x="290" y="280" fill="#7ee787">"B.Tech Student"</text>

    <text x="60" y="315" fill="#79c0ff">"focus"</text>
    <text x="260" y="315" fill="#c9d1d9">:</text>
    <text x="290" y="315" fill="#d2a8ff">[</text>

    <text x="330" y="350" fill="#ffa657">"Cybersecurity"</text>
    <text x="330" y="380" fill="#ffa657">"Artificial Intelligence"</text>
    <text x="330" y="410" fill="#ffa657">"Full Stack Development"</text>

    <text x="290" y="440" fill="#d2a8ff">]</text>

    <text x="60" y="470" fill="#79c0ff">"motto"</text>
    <text x="260" y="470" fill="#c9d1d9">:</text>
    <text x="290" y="470" fill="#ff7b72">"Build. Break. Learn. Secure."</text>

    <!-- Closing -->
    <text x="25" y="500" fill="#f2cc60">}</text>

    <!-- New Prompt -->
    <text x="25" y="525" fill="#3fb950">❯</text>

    <!-- Blinking Cursor -->
    <rect x="48" y="510" width="12" height="18" fill="#3fb950">
      <animate attributeName="opacity"
               values="1;0;1"
               dur="1s"
               repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
